# ~/.config/hypr/hypridle.conf
# Managed by hypridle.service (systemctl --user).

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# 5 min: dim backlight
listener {
    timeout = 300
    on-timeout = /home/vik/.local/bin/hypr-dim-ramp
    on-resume = brightnessctl -r
}

# 10 min: screensaver (any input kills it)
listener {
    timeout = 600
    on-timeout = /home/vik/.local/bin/hypr-screensaver start
    on-resume = /home/vik/.local/bin/hypr-screensaver stop
}

# 20 min: lock (screensaver stopped first so it does not burn CPU under the lock)
listener {
    timeout = 1200
    on-timeout = /home/vik/.local/bin/hypr-screensaver stop; loginctl lock-session
}

# 21 min: screen off
listener {
    timeout = 1260
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 1 h: suspend, only on battery (never while charging)
listener {
    timeout = 3600
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/ADP0/online)" = 1 ] || systemctl suspend'
}

# ~/.config/hypr/hyprlock.conf
# Bound to SUPER + L in hyprland.lua. No restart needed after edits —
# hyprlock reads this file fresh every time it's launched.

$font = JetBrainsMono Nerd Font Mono

# Plain color background. Change this to whatever you like, e.g.:
#   $lock_bg_color = rgba(24, 24, 37, 1.0)   # dark slate
#   $lock_bg_color = rgba(17, 17, 27, 1.0)   # near-black
$lock_bg_color = rgba(30, 30, 46, 1.0)

# The lock screen text is read live from this file — edit it whenever
# you want, no need to touch this config.
$lock_message_file = /home/vik/Desktop/lockscreen_text.txt
$lock_text_color = rgba(173, 216, 230, 1.0)   # light blue

general {
    hide_cursor = false
    grace = 0
    screencopy_mode = 0
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    bezier = easeOut, 0.16, 1, 0.3, 1

    animation = fadeIn, 1, 6, easeOut
    animation = fadeOut, 1, 6, easeOut
    animation = inputFieldDots, 1, 2, linear
    animation = inputFieldColors, 1, 3, easeOut
    animation = inputFieldFade, 1, 4, easeOut
}

background {
    monitor =
    path = screenshot      # blurred snapshot of the desktop, omarchy-style
    color = $lock_bg_color # fallback if the screenshot is unavailable

    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

# Custom text, sourced from the editable txt file.
label {
    monitor =
    text = cmd[update:2000] cat "$lock_message_file"
    font_size = 20
    font_family = $font
    color = $lock_text_color

    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 60
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.2)

    outer_color = rgba(255, 255, 255, 0.4)
    check_color = rgba(00ff99ee)
    fail_color = rgba(ff6633ee)

    font_color = rgb(230, 230, 230)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = Enter password...
    fail_text = $PAMFAIL

    dots_spacing = 0.3

    position = 0, -218
    halign = center
    valign = center
}
